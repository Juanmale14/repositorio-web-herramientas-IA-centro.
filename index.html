<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Repositorio IA | Herramientas Educativas</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;600;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --pastel-blue-bg: #f0f9ff; 
            --accent-indigo: #4f46e5;
        }

        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background-color: var(--pastel-blue-bg);
            color: #1e293b;
            scroll-behavior: smooth;
        }

        .glass-card {
            background: rgba(255, 255, 255, 0.7);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.5);
            border-radius: 2rem;
        }

        .glass-dropdown {
            background: rgba(255, 255, 255, 0.98);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 1);
            border-radius: 1.5rem;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.15);
        }

        .tool-card {
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            border: 1px solid rgba(255, 255, 255, 0.4);
            border-radius: 2rem;
            background: rgba(255, 255, 255, 0.6);
        }

        .tool-card:hover {
            transform: translateY(-10px);
            box-shadow: 0 30px 60px -15px rgba(79, 70, 229, 0.15);
            background: white;
            border-color: rgba(79, 70, 229, 0.2);
        }

        .tag-pill {
            transition: all 0.2s ease;
            cursor: pointer;
        }

        .tag-pill:hover {
            background-color: #eef2ff;
            color: var(--accent-indigo);
            transform: translateY(-1px);
        }

        .tag-pill.active {
            background-color: var(--accent-indigo);
            color: white;
            box-shadow: 0 4px 12px rgba(79, 70, 229, 0.3);
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .animate-fade {
            animation: fadeIn 0.6s ease-out forwards;
        }

        .dropdown-hidden {
            opacity: 0;
            transform: scale(0.95) translateY(-10px) translateX(-50%);
            pointer-events: none;
            visibility: hidden;
        }
        
        .dropdown-visible {
            opacity: 1;
            transform: scale(1) translateY(0) translateX(-50%);
            pointer-events: auto;
            visibility: visible;
        }

        .custom-scrollbar::-webkit-scrollbar {
            width: 8px;
        }
        .custom-scrollbar::-webkit-scrollbar-track {
            background: #f1f5f9;
            border-radius: 10px;
        }
        .custom-scrollbar::-webkit-scrollbar-thumb {
            background: #cbd5e1;
            border-radius: 10px;
        }
        .custom-scrollbar::-webkit-scrollbar-thumb:hover {
            background: #94a3b8;
        }
    </style>
</head>
<body class="min-h-screen flex flex-col" onclick="closeDropdowns(event)">

    <main class="flex-grow pt-12 pb-20 px-6 max-w-7xl mx-auto w-full relative">
        
        <!-- Cabecera -->
        <header class="text-center mb-12 animate-fade">
            <h1 class="text-4xl sm:text-5xl lg:text-6xl font-extrabold mb-6 tracking-tight text-slate-900 leading-tight">
                Repositorio de herramientas digitales educativas creadas con IA
            </h1>
            <p class="text-slate-500 text-lg max-w-2xl mx-auto mb-8 font-medium">
                Una colección curada de aplicaciones inteligentes para potenciar la gestión y el aprendizaje en el aula.
            </p>
            <div class="w-24 h-2 bg-indigo-500 rounded-full mx-auto shadow-sm"></div>
        </header>

        <!-- Filtros -->
        <section class="mb-12 animate-fade relative z-50" style="animation-delay: 0.1s;">
            <div class="flex flex-col items-center">
                <button id="filter-btn" onclick="toggleDropdown(event)" class="glass-card px-8 py-4 flex items-center gap-3 text-indigo-600 font-bold hover:bg-white transition-all shadow-xl shadow-indigo-100/40 active:scale-95">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 4a1 1 0 011-1h16a1 1 0 011 1v2.586a1 1 0 01-.293.707l-6.414 6.414a1 1 0 00-.293.707V17l-4 4v-6.586a1 1 0 00-.293-.707L3.293 7.293A1 1 0 013 6.586V4z" />
                    </svg>
                    Filtrar por etiquetas
                    <svg id="chevron" class="w-4 h-4 transition-transform duration-300" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"></path></svg>
                </button>

                <!-- Menú Desplegable -->
                <div id="dropdown-menu" class="absolute left-1/2 top-full mt-4 w-[90vw] max-w-2xl dropdown-hidden transition-all duration-300 glass-dropdown origin-top">
                    <div class="p-6">
                        <div class="flex justify-between items-center mb-4 px-2">
                            <span class="text-xs font-black uppercase tracking-widest text-indigo-400 italic">Explorar categorías</span>
                            <button onclick="applyFilter('all')" class="text-xs font-bold text-slate-400 hover:text-indigo-600 transition-colors">Limpiar todos</button>
                        </div>
                        <div id="tag-container" class="flex flex-wrap gap-2 max-h-72 overflow-y-auto p-2 custom-scrollbar">
                            <!-- Etiquetas dinámicas -->
                        </div>
                    </div>
                </div>
            </div>

            <!-- Badge de filtro activo -->
            <div id="active-tag-banner" class="hidden flex justify-center mt-6">
                <div class="bg-indigo-600 text-white px-5 py-2 rounded-full text-sm font-bold shadow-lg flex items-center gap-3 animate-fade">
                    <span>Filtrando por: <span id="current-tag-name" class="underline"></span></span>
                    <button onclick="applyFilter('all')" class="bg-white/20 hover:bg-white/40 rounded-full p-1 transition-colors">
                        <svg class="w-4 h-4" fill="currentColor" viewBox="0 0 20 20"><path fill-rule="evenodd" d="M4.293 4.293a1 1 0 011.414 0L10 8.586l4.293-4.293a1 1 0 111.414 1.414L11.414 10l4.293 4.293a1 1 0 01-1.414 1.414L10 11.414l-4.293 4.293a1 1 0 01-1.414-1.414L8.586 10 4.293 5.707a1 1 0 010-1.414z" clip-rule="evenodd"></path></svg>
                    </button>
                </div>
            </div>
        </section>

        <!-- Grid de Publicaciones -->
        <div id="loading" class="flex justify-center py-20">
            <div class="w-12 h-12 border-4 border-indigo-200 border-t-indigo-600 rounded-full animate-spin"></div>
        </div>

        <div id="main-grid" class="hidden grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-8">
            <!-- Tarjetas inyectadas -->
        </div>
    </main>

    <!-- Footer -->
    <footer class="py-12 bg-white/60 backdrop-blur-md border-t border-slate-200">
        <div class="max-w-7xl mx-auto px-6 text-center">
            <p class="text-slate-400 text-xs font-bold uppercase tracking-[0.3em] mb-4">Innovación Digital</p>
            <p class="text-slate-500 italic mb-4">Creado por</p>
            <a href="https://blogsaverroes.juntadeandalucia.es/ellocodelamochila/" target="_blank" class="inline-flex items-center gap-4 group">
                <span class="text-3xl font-black text-slate-900 group-hover:text-indigo-600 transition-all tracking-tighter italic">
                    “El loco de la mochila”
                </span>
                <div class="bg-indigo-600 p-2.5 rounded-2xl text-white group-hover:translate-x-2 transition-transform shadow-xl shadow-indigo-100">
                    <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 7l5 5m0 0l-5 5m5-5H6"></path></svg>
                </div>
            </a>
        </div>
    </footer>

    <script>

            { title: "Participación en clase", url: "https://juanmale14.github.io/participaci-n-en-clase/", tags: ["Participación", "Convivencia", "Aula"], cat: "Aula", cover: "https://images.unsplash.com/photo-1544531586-fde5298cdd40?w=600" },
            { title: "Ruleta para la selección de grupos", url: "https://juanmale14.github.io/ruleta-selecci-n-de-grupos./", tags: ["Gestión de aula", "Aula", "Equipo", "Cooperativo"], cat: "Aula", cover: "https://images.unsplash.com/photo-1606167668584-78701c57f13d?w=600" },
            // IMAGEN CAMBIADA: Grupo unido/Colaboración
            { title: "Recogida de Datos Sociométricos", url: "https://juanmale14.github.io/recogida-datos-an-lisis-sociom-trico./", tags: ["Gestión de aula", "Cooperativo", "Convivencia", "Equipo", "Aula", "Datos"], cat: "Aula", cover: "https://images.unsplash.com/photo-1517486808906-6ca8b3f04846?w=600" },
            // IMAGEN CAMBIADA: Gráfico de redes/Conexiones
            { title: "Analizadora Sociométrica", url: "https://juanmale14.github.io/an-lisis-sociom-trico-grupo./", tags: ["Cooperativo", "Convivencia", "Centro", "Equipo", "Datos", "Gestión de aula", "inclusión"], cat: "Aula", cover: "https://images.unsplash.com/photo-1526628953301-3e589a6a8b74?w=600" },

            // APLICACIONES INTERACTIVAS
            { title: "Capas de la Tierra", url: "https://juanmale14.github.io/capas-de-la-Tierra./", tags: ["Juego", "Ludificación", "Biología", "Geología"], cat: "Interactiva", cover: "https://images.unsplash.com/photo-1451187580459-43490279c0fa?w=600" },
            { title: "Práctica de Tiempos Verbales", url: "https://juanmale14.github.io/juego-tiempos-verbales./", tags: ["Juego", "Ludificación", "Gramática"], cat: "Interactiva", cover: "https://images.unsplash.com/photo-1501139083538-0139583c060f?w=600" },
            // IMAGEN CAMBIADA: Vía Láctea/Estrellas
            { title: "Planetas del Sistema Solar", url: "https://juanmale14.github.io/planetas-sistema-solar/", tags: ["Juego", "Ludificación", "Biología"], cat: "Interactiva", cover: "https://images.unsplash.com/photo-1444703686981-a3abbc4d4fe3?w=600" },
            // IMAGEN CAMBIADA: Pila de libros aesthetic
            { title: "Subgéneros Literarios", url: "https://juanmale14.github.io/g-literarios/", tags: ["Literatura", "Ludificación", "Juego"], cat: "Interactiva", cover: "https://images.unsplash.com/photo-1476275466078-4007374efbbe?w=600" },
            { title: "Aplicación sobre el Sistema Respiratorio", url: "https://juanmale14.github.io/aplicaci-n-sistema-respiratorio./", tags: ["Juego", "Biología"], cat: "Interactiva", cover: "https://images.unsplash.com/photo-1530026405186-ed1f139313f8?w=600" },
            // IMAGEN CAMBIADA: Gato curioso (temática animal)
            { title: "Juego de Pasapalabra sobre animales", url: "https://juanmale14.github.io/juego-pasapalabra-CANVA-./", tags: ["Juego", "Ludificación", "Biología"], cat: "Interactiva", cover: "https://images.unsplash.com/photo-1472491235688-bdc81a63246e?w=600" },
            { title: "Memory de Verbos Irregulares", url: "https://juanmale14.github.io/The-memory-para-verbos-en-ingl-s./", tags: ["Juego", "Ludificación", "Inglés"], cat: "Interactiva", cover: "https://images.unsplash.com/photo-1534333555562-b98a3c944747?w=600" },
            { title: "Sudoku Matemático", url: "https://juanmale14.github.io/Sudoku2/", tags: ["Matemáticas", "Juego", "Cálculo"], cat: "Interactiva", cover: "https://images.unsplash.com/photo-1580541832626-2a7131ee809f?w=600" },

            // IMAGEN CAMBIADA: Monedas de oro/Tesoro
            { title: "Quién Quiere Ser Millonario", url: "https://juanmale14.github.io/juego-qui-n-quiere-ser-millonario%2F", tags: ["Ludificación", "Juego", "Comunicación"], cat: "Interactiva", cover: "https://images.unsplash.com/photo-1563206767-5b1d97299337?w=600" },
            { title: "Tipos de Seres Vivos", url: "https://juanmale14.github.io/esquema_interactivo/", tags: ["Juego", "Ludificación", "Biología"], cat: "Interactiva", cover: "https://images.unsplash.com/photo-1441974231531-c6227db76b6e?w=600" },
            { title: "Categorías Gramaticales", url: "https://juanmale14.github.io/juego-categor-as-gramaticales/", tags: ["Juego", "Ludificación", "Gramática"], cat: "Interactiva", cover: "https://images.unsplash.com/photo-1456513080510-7bf3a84b82f8?w=600" },
            { title: "Tres en Raya", url: "https://juanmale14.github.io/tic_tac_toe/", tags: ["Juego", "Ludificación"], cat: "Interactiva", cover: "https://images.unsplash.com/photo-1611996575749-79a3a250f948?w=600" },
            { title: "Misión Pingüino multiplicador", url: "https://juanmale14.github.io/ping-ino-multiplicador./", tags: ["Ludificación", "Juego", "Matemáticas"], cat: "Interactiva", cover: "https://images.unsplash.com/photo-1596495578065-6e0763fa1178?w=600" },
            { title: "Explorador de palabras: categorías gramaticales", url: "https://juanmale14.github.io/categor-as-gramaticales./", tags: ["Juego", "Ludificación", "Gramática"], cat: "Interactiva", cover: "https://images.unsplash.com/photo-1471107340929-a87cd0f5b5f3?w=600" },
            { title: "Análisis de Comprensión Lectora", url: "https://juanmale14.github.io/Estad-sticas-tratamiento-lectura./", tags: ["Datos", "Evaluación", "Estadísticas", "Lectura"], cat: "Centro", cover: "https://images.unsplash.com/photo-1506880018603-83d5b814b5a6?w=600" }
        ];

        let menuOpen = false;

        function init() {
            renderTags();
            renderCards(DATABASE);
            
            setTimeout(() => {
                document.getElementById('loading').style.display = 'none';
                document.getElementById('main-grid').classList.remove('hidden');
            }, 800);
        }

        function toggleDropdown(e) {
            e.stopPropagation();
            const menu = document.getElementById('dropdown-menu');
            const chevron = document.getElementById('chevron');
            menuOpen = !menuOpen;
            
            if(menuOpen) {
                menu.classList.remove('dropdown-hidden');
                menu.classList.add('dropdown-visible');
                chevron.style.transform = 'rotate(180deg)';
            } else {
                closeMenu();
            }
        }

        function closeMenu() {
            const menu = document.getElementById('dropdown-menu');
            const chevron = document.getElementById('chevron');
            menu.classList.remove('dropdown-visible');
            menu.classList.add('dropdown-hidden');
            chevron.style.transform = 'rotate(0deg)';
            menuOpen = false;
        }

        function closeDropdowns(e) {
            if (menuOpen && !document.getElementById('dropdown-menu').contains(e.target)) {
                closeMenu();
            }
        }

        function renderTags() {
            const container = document.getElementById('tag-container');
            const tags = new Set();
            DATABASE.forEach(item => item.tags.forEach(tag => tags.add(tag)));
            
            const sortedTags = Array.from(tags).sort();
            sortedTags.forEach(tag => {
                const btn = document.createElement('button');
                btn.className = "tag-pill px-4 py-2 rounded-xl bg-slate-50 border border-slate-200 text-slate-600 font-bold text-xs shadow-sm uppercase tracking-wider";
                btn.innerText = tag;
                btn.onclick = (e) => {
                    e.stopPropagation();
                    applyFilter(tag);
                    closeMenu();
                };
                container.appendChild(btn);
            });
        }

        function applyFilter(tag) {
            const banner = document.getElementById('active-tag-banner');
            const tagName = document.getElementById('current-tag-name');
            
            if (tag === 'all') {
                renderCards(DATABASE);
                banner.classList.add('hidden');
            } else {
                const filtered = DATABASE.filter(item => item.tags.includes(tag));
                renderCards(filtered);
                tagName.innerText = tag;
                banner.classList.remove('hidden');
            }
        }

        function renderCards(data) {
            const container = document.getElementById('main-grid');
            container.innerHTML = '';
            
            data.forEach((item, i) => {
                const card = document.createElement('div');
                card.className = "tool-card overflow-hidden flex flex-col h-full animate-fade";
                card.style.animationDelay = `${i * 0.05}s`;
                
                const catColors = {
                    "Centro": "bg-emerald-50 text-emerald-600",
                    "Aula": "bg-blue-50 text-blue-600",
                    "Interactiva": "bg-amber-50 text-amber-600"
                };

                card.innerHTML = `
                    <div class="relative h-56 overflow-hidden">
                        <img src="${item.cover}" alt="${item.title}" class="w-full h-full object-cover transition-transform duration-1000 group-hover:scale-110" onerror="this.src='https://images.unsplash.com/photo-1481627834876-b7833e8f5570?w=600'">
                        <div class="absolute inset-0 bg-gradient-to-t from-black/50 via-transparent to-transparent"></div>
                        <div class="absolute top-4 right-4 ${catColors[item.cat]} px-4 py-1.5 rounded-full text-[10px] font-black uppercase tracking-[0.2em] shadow-lg backdrop-blur-md">
                            ${item.cat}
                        </div>
                    </div>
                    <div class="p-8 flex flex-col flex-grow">
                        <h3 class="text-xl font-bold text-slate-800 mb-4 leading-snug tracking-tight">
                            ${item.title}
                        </h3>
                        <div class="flex flex-wrap gap-2 mb-8">
                            ${item.tags.map(t => `<span class="text-[9px] font-extrabold bg-indigo-50 text-indigo-500 px-2.5 py-1 rounded-md uppercase tracking-widest border border-indigo-100/50">#${t}</span>`).join('')}
                        </div>
                        <a href="${item.url}" target="_blank" class="mt-auto flex items-center justify-center gap-2 w-full bg-indigo-600 hover:bg-indigo-700 text-white font-bold py-4 rounded-2xl transition-all shadow-xl shadow-indigo-100 hover:shadow-indigo-200">
                            Explorar Herramienta
                            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 6H6a2 2 0 00-2 2v10a2 2 0 002 2h10a2 2 0 002-2v-4M14 4h6m0 0v6m0-6L10 14"></path></svg>
                        </a>
                    </div>
                `;
                container.appendChild(card);
            });
        }

        window.onload = init;
    </script>
</body>
</html>
