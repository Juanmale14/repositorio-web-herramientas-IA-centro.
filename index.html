<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Repositorio IA | Herramientas Educativas</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;600;700;800&display=swap" rel="stylesheet">
    <style>
        /* --- RESET Y VARIABLES --- */
        :root {
            --bg-color: #f0f9ff;
            --text-main: #1e293b;
            --text-muted: #64748b;
            --primary: #4f46e5;
            --primary-hover: #4338ca;
            --white: #ffffff;
            --glass-bg: rgba(255, 255, 255, 0.7);
            --glass-border: rgba(255, 255, 255, 0.5);
            --shadow-soft: 0 10px 30px -10px rgba(0, 0, 0, 0.1);
            --shadow-hover: 0 20px 40px -10px rgba(79, 70, 229, 0.2);
            --radius-lg: 24px;
            --radius-md: 16px;
            --radius-sm: 8px;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            line-height: 1.6;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        /* --- LAYOUT --- */
        .container {
            max-width: 1280px;
            margin: 0 auto;
            padding: 0 20px;
            width: 100%;
        }

        main {
            flex: 1;
            padding-top: 60px;
            padding-bottom: 80px;
        }

        /* --- HEADER --- */
        header {
            text-align: center;
            margin-bottom: 60px;
            animation: fadeIn 0.8s ease-out;
        }

        h1 {
            font-size: 2.5rem;
            font-weight: 800;
            margin-bottom: 20px;
            letter-spacing: -0.03em;
            color: #0f172a;
            line-height: 1.1;
        }

        .subtitle {
            font-size: 1.125rem;
            color: var(--text-muted);
            max-width: 600px;
            margin: 0 auto 30px;
            font-weight: 500;
        }

        .divider {
            width: 80px;
            height: 6px;
            background-color: var(--primary);
            border-radius: 10px;
            margin: 0 auto;
            opacity: 0.8;
        }

        /* --- FILTROS Y DROPDOWN --- */
        .filter-section {
            position: relative;
            margin-bottom: 60px;
            z-index: 100;
            display: flex;
            flex-direction: column;
            align-items: center;
            animation: fadeIn 0.8s ease-out 0.2s backwards;
        }

        .btn-filter {
            background: rgba(255, 255, 255, 0.8);
            backdrop-filter: blur(10px);
            border: 1px solid var(--white);
            padding: 16px 32px;
            border-radius: var(--radius-lg);
            font-size: 1rem;
            font-weight: 700;
            color: var(--primary);
            cursor: pointer;
            box-shadow: var(--shadow-soft);
            display: flex;
            align-items: center;
            gap: 12px;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .btn-filter:hover {
            background: var(--white);
            transform: translateY(-2px);
            box-shadow: var(--shadow-hover);
        }

        .btn-filter svg {
            width: 20px;
            height: 20px;
        }

        .chevron {
            transition: transform 0.3s ease;
        }

        .dropdown-menu {
            position: absolute;
            top: 100%;
            left: 50%;
            transform: translateX(-50%) translateY(10px) scale(0.95);
            width: 90vw;
            max-width: 700px;
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(20px);
            border: 1px solid var(--white);
            border-radius: var(--radius-lg);
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.2);
            padding: 24px;
            margin-top: 15px;
            opacity: 0;
            visibility: hidden;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            transform-origin: top center;
        }

        .dropdown-menu.active {
            opacity: 1;
            visibility: visible;
            transform: translateX(-50%) translateY(0) scale(1);
        }

        .dropdown-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 16px;
            padding-bottom: 10px;
            border-bottom: 1px solid #e2e8f0;
        }

        .dropdown-title {
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 2px;
            font-weight: 800;
            color: #94a3b8;
        }

        .btn-clean {
            background: none;
            border: none;
            color: var(--text-muted);
            font-size: 0.8rem;
            font-weight: 700;
            cursor: pointer;
            text-decoration: underline;
            text-decoration-style: dotted;
        }

        .btn-clean:hover {
            color: var(--primary);
        }

        .tags-grid {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            max-height: 300px;
            overflow-y: auto;
            padding-right: 5px;
        }

        /* Scrollbar personalizada */
        .tags-grid::-webkit-scrollbar { width: 6px; }
        .tags-grid::-webkit-scrollbar-track { background: #f1f5f9; border-radius: 4px; }
        .tags-grid::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }

        .tag-btn {
            background: #f8fafc;
            border: 1px solid #e2e8f0;
            padding: 8px 16px;
            border-radius: var(--radius-md);
            font-size: 0.8rem;
            font-weight: 700;
            color: #475569;
            cursor: pointer;
            transition: all 0.2s ease;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .tag-btn:hover {
            background: #eef2ff;
            color: var(--primary);
            border-color: #c7d2fe;
            transform: translateY(-1px);
        }

        .active-filter-banner {
            margin-top: 20px;
            background: var(--primary);
            color: var(--white);
            padding: 8px 20px;
            border-radius: 50px;
            font-size: 0.9rem;
            font-weight: 600;
            display: inline-flex;
            align-items: center;
            gap: 10px;
            box-shadow: 0 4px 12px rgba(79, 70, 229, 0.3);
            animation: fadeIn 0.4s ease;
        }

        .btn-close-filter {
            background: rgba(255, 255, 255, 0.2);
            border: none;
            width: 20px;
            height: 20px;
            border-radius: 50%;
            color: white;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 12px;
        }

        .hidden { display: none !important; }

        /* --- GRID Y TARJETAS --- */
        .grid-tools {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
            gap: 30px;
        }

        .card {
            background: rgba(255, 255, 255, 0.7);
            border: 1px solid var(--white);
            border-radius: var(--radius-lg);
            overflow: hidden;
            display: flex;
            flex-direction: column;
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            height: 100%;
            position: relative;
        }

        .card:hover {
            transform: translateY(-10px);
            background: var(--white);
            box-shadow: var(--shadow-hover);
            z-index: 2;
        }

        .card-img-wrapper {
            height: 200px;
            width: 100%;
            position: relative;
            overflow: hidden;
        }

        .card-img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: transform 0.8s ease;
        }

        .card:hover .card-img {
            transform: scale(1.1);
        }

        .card-overlay {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            height: 50%;
            background: linear-gradient(to top, rgba(0,0,0,0.4), transparent);
        }

        .card-badge {
            position: absolute;
            top: 15px;
            right: 15px;
            padding: 6px 12px;
            border-radius: 20px;
            font-size: 0.65rem;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 1px;
            backdrop-filter: blur(8px);
            background: rgba(255, 255, 255, 0.9);
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }

        .badge-centro { color: #059669; }
        .badge-aula { color: #2563eb; }
        .badge-interactiva { color: #d97706; }

        .card-content {
            padding: 24px;
            display: flex;
            flex-direction: column;
            flex-grow: 1;
        }

        .card-title {
            font-size: 1.25rem;
            font-weight: 700;
            margin-bottom: 12px;
            color: #0f172a;
            line-height: 1.3;
        }

        .card-tags {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
            margin-bottom: 24px;
        }

        .card-tag {
            font-size: 0.6rem;
            font-weight: 700;
            text-transform: uppercase;
            color: var(--primary);
            background: #eef2ff;
            padding: 4px 8px;
            border-radius: 6px;
            border: 1px solid #e0e7ff;
        }

        .btn-card {
            margin-top: auto;
            background: var(--primary);
            color: var(--white);
            text-decoration: none;
            padding: 14px;
            border-radius: var(--radius-md);
            font-weight: 700;
            font-size: 0.9rem;
            text-align: center;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            transition: background 0.3s ease, transform 0.2s;
            box-shadow: 0 4px 12px rgba(79, 70, 229, 0.3);
        }

        .btn-card:hover {
            background: var(--primary-hover);
            transform: scale(1.02);
        }

        /* --- FOOTER --- */
        footer {
            background: rgba(255, 255, 255, 0.6);
            backdrop-filter: blur(10px);
            border-top: 1px solid #e2e8f0;
            padding: 40px 0;
            text-align: center;
            margin-top: auto;
        }

        .footer-label {
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 2px;
            color: #94a3b8;
            font-weight: 700;
            margin-bottom: 10px;
        }

        .author-link {
            display: inline-flex;
            align-items: center;
            gap: 12px;
            text-decoration: none;
            color: #334155;
            font-size: 1.2rem;
            font-weight: 800;
            font-style: italic;
            transition: color 0.3s ease;
        }

        .author-link:hover {
            color: var(--primary);
        }

        .icon-box {
            background: var(--primary);
            color: white;
            width: 36px;
            height: 36px;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 4px 10px rgba(79, 70, 229, 0.3);
            transition: transform 0.3s ease;
        }

        .author-link:hover .icon-box {
            transform: translateX(5px);
        }

        /* --- ANIMACIONES Y CARGA --- */
        .loading-spinner {
            width: 50px;
            height: 50px;
            border: 4px solid #e2e8f0;
            border-top: 4px solid var(--primary);
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 40px auto;
        }

        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* --- RESPONSIVE --- */
        @media (max-width: 768px) {
            h1 { font-size: 2rem; }
            .grid-tools { grid-template-columns: 1fr; }
            .dropdown-menu { width: 95vw; }
        }
    </style>
</head>
<body onclick="closeDropdowns(event)">

    <main>

                </div>

                <div id="active-tag-banner" class="active-filter-banner hidden">

                    <button onclick="applyFilter('all')" class="btn-close-filter">✕</button>
                </div>
            </section>

            <!-- Loading -->
            <div id="loading" class="loading-spinner"></div>

            <!-- Grid -->
            <div id="main-grid" class="grid-tools hidden">
                <!-- Cards generadas por JS -->
            </div>
        </div>
    </main>

            { title: "Análisis de Comprensión Lectora", url: "https://juanmale14.github.io/Estad-sticas-tratamiento-lectura./", tags: ["Datos", "Evaluación", "Estadísticas", "Lectura"], cat: "Centro", cover: "https://images.unsplash.com/photo-1506880018603-83d5b814b5a6?w=600" },
            { title: "Analizadora Sociométrica 5.0 VERSIÓN 2", url: "https://juanmale14.github.io/an-lisis-sociom-trico-VERSI-N-2/", tags: ["IA", "Cooperativo", "Convivencia", "Datos", "Equipo", "Gestión de aula", "inclusión", "Aula"], cat: "Aula", cover: "https://images.unsplash.com/photo-1551288049-bebda4e38f71?w=600" },
            { title: "Editora de html", url: "https://juanmale14.github.io/creadora-archivos-html/", tags: ["IA", "Informática", "Publicar", "Ordenadores", "TIC"], cat: "Aula", cover: "https://images.unsplash.com/photo-1542831371-29b0f74f9713?w=600" },
            { title: "Tutti Frutti Pro.", url: "https://juanmale14.github.io/juego-tutti-fruti/", tags: ["Lengua", "Juego", "Ludificación"], cat: "Interactiva", cover: "https://images.unsplash.com/photo-1610832958506-aa56368176cf?w=600" },
            // NUEVA AÑADIDA
            { title: "Gestión del uso de portátiles", url: "https://juanmale14.github.io/gesti-n-pcs-de-carritos./", tags: ["Gestión de aula", "Carritos", "Ordenadores", "TIC"], cat: "Aula", cover: "https://images.unsplash.com/photo-1496181133206-80ce9b88a853?w=600" } 
        ];

        let menuOpen = false;

        function init() {
            renderTags();
            renderCards(DATABASE);
            
            // Simular carga y mostrar grid
            setTimeout(() => {
                document.getElementById('loading').style.display = 'none';
                document.getElementById('main-grid').classList.remove('hidden');
            }, 500);
        }

        // --- LÓGICA DE DROPDOWN Y FILTROS ---
        function toggleDropdown(e) {
            e.stopPropagation();
            const menu = document.getElementById('dropdown-menu');
            const chevron = document.getElementById('chevron');
            menuOpen = !menuOpen;
            
            if (menuOpen) {
                menu.classList.add('active');
                chevron.style.transform = 'rotate(180deg)';
            } else {
                closeMenu();
            }
        }

        function closeMenu() {
            const menu = document.getElementById('dropdown-menu');
            const chevron = document.getElementById('chevron');
            menu.classList.remove('active');
            chevron.style.transform = 'rotate(0deg)';
            menuOpen = false;
        }

        function closeDropdowns(e) {
            const menu = document.getElementById('dropdown-menu');
            const btn = document.getElementById('filter-btn');
            if (menuOpen && !menu.contains(e.target) && !btn.contains(e.target)) {
                closeMenu();
            }
        }

        function renderTags() {
            const container = document.getElementById('tag-container');
            const tags = new Set();
            DATABASE.forEach(item => item.tags.forEach(tag => tags.add(tag)));
            
            const sortedTags = Array.from(tags).sort();
            sortedTags.forEach(tag => {
                const btn = document.createElement('button');
                btn.className = "tag-btn";
                btn.innerText = tag;
                btn.onclick = (e) => {
                    e.stopPropagation();
                    applyFilter(tag);
                    closeMenu();
                };
                container.appendChild(btn);
            });
        }

        function applyFilter(tag) {
            const banner = document.getElementById('active-tag-banner');
            const tagName = document.getElementById('current-tag-name');
            
            if (tag === 'all') {
                renderCards(DATABASE);
                banner.classList.add('hidden');
            } else {
                const filtered = DATABASE.filter(item => item.tags.includes(tag));
                renderCards(filtered);
                tagName.innerText = tag;
                banner.classList.remove('hidden');
            }
        }

        // --- RENDERIZADO DE TARJETAS ---
        function renderCards(data) {
            const container = document.getElementById('main-grid');
            container.innerHTML = '';
            
            data.forEach((item, i) => {
                const card = document.createElement('article');
                card.className = "card";
                card.style.animation = `fadeIn 0.6s ease-out ${i * 0.05}s backwards`;
                
                // Color badge según categoría
                let badgeClass = '';
                if(item.cat === 'Centro') badgeClass = 'badge-centro';
                else if(item.cat === 'Aula') badgeClass = 'badge-aula';
                else badgeClass = 'badge-interactiva';

                const tagsHTML = item.tags.map(t => `<span class="card-tag">#${t}</span>`).join('');

                card.innerHTML = `
                    <div class="card-img-wrapper">
                        <img src="${item.cover}" alt="${item.title}" class="card-img" onerror="this.src='https://images.unsplash.com/photo-1481627834876-b7833e8f5570?w=600'">
                        <div class="card-overlay"></div>
                        <div class="card-badge ${badgeClass}">${item.cat}</div>
                    </div>
                    <div class="card-content">
                        <h3 class="card-title">${item.title}</h3>
                        <div class="card-tags">
                            ${tagsHTML}
                        </div>
                        <a href="${item.url}" target="_blank" class="btn-card">
                            Explorar Herramienta
                            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"></path><polyline points="15 3 21 3 21 9"></polyline><line x1="10" y1="14" x2="21" y2="3"></line></svg>
                        </a>
                    </div>
                `;
                container.appendChild(card);
            });
        }

        window.onload = init;
    </script>
</body>
</html>
